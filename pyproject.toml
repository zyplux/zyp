[project]
name = "totvibe"
version = "0"
description = "totvibe — virtual workspace root (Bun app; Python development tools and infrastructure scripts)"
requires-python = ">=3.14"

[tool.uv]
package = false

[tool.uv.workspace]
members = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.report]
fail_under = 90

[tool.vulture]
paths = ["scripts"]

[dependency-groups]
lint = [
    "ruff>=0.15.20",
    "rumdl>=0.2.28",
    "vulture>=2.16",
    "zyplux-cerberus>=0.27.2",
]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
type = [
    "pyrefly>=1.1.1",
]
