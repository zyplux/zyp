packages:
  - 'apps/*'
  - 'packages/*'
  - 'tests'

catalog:
  '@ai-sdk/openai-compatible': '^3'
  '@opentui/core': '0.4.2'
  '@opentui/react': '0.4.2'
  '@testing-library/react': '^16'
  '@types/bun': 'latest'
  '@types/react': '^19'
  '@types/react-dom': '^19'
  '@vitest/coverage-istanbul': '^4.1.9'
  '@zyplux/cz': '^0.16.0'
  '@zyplux/eslint-config': '^0.12.3'
  'ai': '^7'
  'bun': '1.3.14'
  'citty': '^0.2.2'
  'eslint': '^10.6.0'
  'happy-dom': '^20'
  'jiti': '^2.7.0'
  'jotai': '^2'
  'knip': '^6.24.0'
  'prettier': '^3.9.4'
  'react': '^19'
  'react-dom': '^19'
  'typescript': '^6.0.3'
  'vitest': '^4.1.9'
  'zod': '^4'

minimumReleaseAge: 1440
minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@zyplux/*'

allowBuilds:
  bun: true

resolvePeersFromWorkspaceRoot: false
